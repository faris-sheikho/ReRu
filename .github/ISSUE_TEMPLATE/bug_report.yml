name: Bug report
description: Report something that does not work as expected
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first.
        For security problems, do not use this form — see [SECURITY.md](https://github.com/mansiverma897993/ReRu/blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear and short description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact startup flags, commands, and client. A minimal reproduction is best.
      render: shell
      placeholder: |
        ./target/release/reru --port 6379
        redis-cli SET key value
        redis-cli TTL key
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual output
      description: Paste the full response or error.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Strings and cache
        - Lists
        - Hashes
        - Sets
        - Sorted sets
        - Bitmaps
        - Streams
        - Geospatial
        - HyperLogLog
        - Transactions
        - Pub/Sub
        - Persistence (snapshot, AOF, RDB)
        - Replication
        - Authentication
        - Connection and protocol
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ReRu version
      description: Output of `reru --version` and `git rev-parse --short HEAD` if you built from source.
    validations:
      required: true
  - type: input
    id: rust
    attributes:
      label: Rust version
      description: Output of `rustc --version`.
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.1, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Logs, comparisons with a real Redis server, or related issues.
